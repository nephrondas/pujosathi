# PujoSathi backend on Render — render.yaml (Blueprint)
# After first deploy, Render assigns the URL:  https://<service-name>.onrender.com
services:
  - type: web
    name: pujosathi-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /api/health
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false          # set in Render dashboard (do not commit)
      - key: VITE_SUPABASE_ANON_KEY
        sync: false          # set in Render dashboard (do not commit)
